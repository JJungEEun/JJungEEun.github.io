career-profile:
    title: Career Profile
    summary: |
      I’m Eun Jung, a Master’s student in the [Electrical and Computer Engineering department](https://ice.skku.edu/eng_ice/programs/departments/computer_intro.do) at [Sungkyunkwan University](https://www.skku.edu/eng/index.do), advised by Professor [Hyoungshick Kim](https://seclab.skku.edu/people/hyoungshick-kim/). 
      I received my Bachelor's degree in Data Technology (Software Convergence) from [Myongji University](https://www.mju.ac.kr/mjukr/index.do).

      Previsouly, I served as a Visiting Researcher at the [University of Maryland](https://umd.edu), College Park, advised by Professor [Yongwhi Kwon](https://ece.umd.edu/clark/faculty/1845/Yonghwi-Kwon) at the the [University of Maryland Cybersecurity Center](https://cyber.umd.edu).
  
research-interest:
    title: Research Interest
    summary: |
            My research focuses on the security of AI systems, with particular **attention to vulnerabilities in deep learning models and large language models (LLMs)**. 
            Particularly, I am interested in evaluating the reliability and robustness by diagnosing **'Shortcut Learning'** behaviors, where models rely  on superficial syntax rather than core semantics, using XAI-driven verification.
            I also investigate the adversarial attacks by analyzing model vulnerabilities against perturbation-based adversarial attacks.

