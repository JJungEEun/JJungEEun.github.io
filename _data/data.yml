career-profile:
    title: Career Profile
    summary: |
      Hello! I’m Eun Jung, a Master’s student in the [Electrical and Computer Engineering department](https://ice.skku.edu/eng_ice/programs/departments/computer_intro.do) 
      at [Sungkyunkwan University](https://www.skku.edu/eng/index.do), advised by Professor [Hyoungshick Kim](https://seclab.skku.edu/people/hyoungshick-kim/). 
      I am interested in AI security.

research-interest:
    title: Research Interest
    summary: |
     My research focuses on the security of AI systems, with particular attention to vulnerabilities in deep learning models and large language models (LLMs). 
     I am interested in adversarial attacks, aiming to improve the robustness and reliability of AI systems in real-world applications.

